name: Replace index and fix theme tune

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace index.html and fix theme tune audio
        run: |
          set -e
          test -f graduation-photo-portal.html
          mv graduation-photo-portal.html index.html
          perl -0777 -i -pe 's/(<audio\b[^>]*?src=")[^"]*(")/$1assets\/theme-tune.mp3$2/s' index.html
          echo "--- audio tags after fix ---"
          grep -o '<audio[^>]*>' index.html || echo "no audio tag found"
          grep -F 'src="assets/theme-tune.mp3"' index.html

      - name: Commit, delete this workflow, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-theme-tune.yml
          git add -A
          git status --short
          git commit -m "Replace index.html with newest portal; point theme tune at assets/theme-tune.mp3"
          git push
