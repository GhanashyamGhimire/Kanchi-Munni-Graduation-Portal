name: Fix theme tune src

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-theme-tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace embedded audio src with file path
        run: |
          perl -0777 -i -pe 's/(<audio id="themeTune" src=")data:[^"]*(")/$1assets\/theme-tune.mp3$2/' index.html
          grep -o '<audio id="themeTune"[^>]*>' index.html
      - name: Commit if changed
        run: |
          git config user.name "GhanashyamGhimire"
          git config user.email "GhanashyamGhimire@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Point theme tune at assets/theme-tune.mp3"
          git push
