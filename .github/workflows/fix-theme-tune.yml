name: Fix theme tune
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix theme tune file and audio source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "data URI occurrences before: $(grep -c 'data:application/octet-stream' index.html || true)"
          git rm -q assets/theme-tune.mp3
          git mv assets/doraemon-full-iwncGYFPxmU.mp3 assets/theme-tune.mp3
          perl -i -pe 's{src="data:application/octet-stream;base64,[^"]*"}{src="assets/theme-tune.mp3"}' index.html
          echo "audio tag after fix:"
          grep -o '<audio[^>]*>' index.html | cut -c1-200
          if grep -q 'data:application/octet-stream' index.html; then
            echo "ERROR: data URI still present in index.html"
            exit 1
          fi
          ls -l assets/theme-tune.mp3
          test -s assets/theme-tune.mp3
          rm .github/workflows/fix-theme-tune.yml
          git add -A
          git status --short
          git commit -m "Point theme tune at assets/theme-tune.mp3"
          git push
