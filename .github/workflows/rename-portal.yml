name: Rename portal file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded portal file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv graduation-photo-portal.html index.html
          rm -f .github/workflows/rename-portal.yml
          git add -A
          git commit -m "Replace index.html with new graduation portal version"
          git push
