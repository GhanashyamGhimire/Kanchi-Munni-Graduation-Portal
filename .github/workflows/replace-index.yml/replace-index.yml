name: Replace index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with uploaded portal file
        run: |
          set -e
          test -f graduation-photo-portal.html
          mv graduation-photo-portal.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace index.html with new portal version"
          git push
